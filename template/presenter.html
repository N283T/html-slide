<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Presenter — html-slide</title>
<style>
  /* A speaker console for the second screen, not a mirror of the deck:
   * no preview of the slide at any size — the projector already shows
   * it. The room goes to what the projected slide cannot tell the
   * speaker: how long the talk has been running, the notes at a
   * readable size, and the name of whatever comes next.
   * (Layout carried over from the openadmet-pxr-slides presenter.) */
  /* pxr-slides layout, html-slide chrome colors (same palette as the
   * editor sidebar and toolbar: dark panels, orange primary, teal
   * secondary). --blue keeps its name from the original stylesheet
   * but carries the primary accent. */
  :root {
    --bg: #101216;
    --surface: #17191e;
    --btn: #1f222a;
    --ink: #e8eaef;
    --muted: #8b93a3;
    --line: #262a32;
    --blue: #cc6a00;
    --teal: #4fd6c2;
    --font-display: "Outfit", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
  }
  #root {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(240px, 24vw, 440px);
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 16px;
  }
  .panel {
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 20px;
    background: var(--surface);
  }
  .panel__head {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 1em;
    margin: 0 0 12px;
    font-family: var(--font-display);
    font-size: 0.95rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .panel__head .spacer { flex: 1; }
  button {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--btn);
    color: var(--ink);
    font-family: var(--font-display);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--blue); }
  button:disabled { opacity: 0.35; cursor: default; }
  kbd {
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 5px;
    font-size: 0.8em;
  }

  /* ---- status bar ---- */
  .bar {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: flex-start;
    justify-content: space-between;
    gap: 32px;
  }
  .deckstate {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .position {
    display: flex;
    align-items: baseline;
    gap: 0.4em;
    font-family: var(--font-mono);
    line-height: 1;
  }
  #position { font-size: 3rem; }
  #total { font-size: 1.3rem; color: var(--muted); }
  .progress {
    height: 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--btn);
    overflow: hidden;
  }
  .progress__fill {
    width: 0;
    height: 100%;
    background: var(--blue);
    transition: width 0.18s ease;
  }
  .upnext {
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 0.7em;
    min-width: 0;
    font-family: var(--font-display);
    font-size: 1.2rem;
  }
  .upnext__label {
    flex: 0 0 auto;
    font-size: 0.7em;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  #next-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clockstate {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  #elapsed { font-family: var(--font-mono); font-size: 3rem; line-height: 1; color: var(--teal); }
  .clockrow {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    color: var(--muted);
  }
  .timer-buttons { display: flex; gap: 8px; }
  .timer-buttons button { padding: 6px 16px; font-size: 0.95rem; }

  /* ---- notes ---- */
  #notes-title {
    flex: 0 0 auto;
    margin: 0 0 12px;
    font-family: var(--font-display);
    font-size: 1.7rem;
    line-height: 1.2;
  }
  .fontsize { display: flex; gap: 6px; }
  .fontsize button {
    padding: 2px 10px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  #notes {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    /* overwritten from localStorage on load; this is the first-run size */
    font-size: 1.4rem;
    line-height: 1.7;
  }
  #notes > :first-child { margin-top: 0; }
  #notes > :last-child { margin-bottom: 0; }

  /* ---- slide outline ---- */
  .outline {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .outline button {
    display: flex;
    align-items: baseline;
    gap: 0.7em;
    width: 100%;
    padding: 6px 10px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    text-align: left;
    font-size: 0.95rem;
  }
  .outline button:hover:not(.is-current) { background: var(--btn); }
  .outline button.is-current { background: var(--blue); color: #fff; }
  .outline__num {
    flex: 0 0 2.2em;
    text-align: right;
    font-family: var(--font-mono);
    font-size: 0.85em;
    color: var(--muted);
  }
  .outline button.is-current .outline__num { color: rgba(255, 255, 255, 0.75); }
  .outline__label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---- controls ----
   * One row of equal buttons: at a lectern the target is found by
   * position, and a row of differently sized ones is harder to hit
   * without looking. Only 次へ is filled, so the eye lands on the one
   * button pressed most; 前へ is the same hue outlined, and 一覧 takes
   * the other accent. */
  .controls {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
  }
  .controls > button {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 0;
    font-size: 1.05rem;
  }
  .controls > button.is-next {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .controls > button.is-next:hover:not(:disabled) { filter: brightness(1.12); }
  .controls > button.is-prev { border-color: var(--blue); color: #ff9d42; }
  .controls > button.is-prev:hover:not(:disabled) { background: rgba(204, 106, 0, 0.12); }
  .controls > button.is-overview { border-color: var(--teal); }
  .controls > button.is-overview:hover:not(:disabled) { background: rgba(79, 214, 194, 0.1); }
  .controls > button.is-overview .btn-icon { fill: var(--teal); }
  .btn-icon { flex: 0 0 auto; width: 1em; height: 1em; fill: currentColor; }

  /* ---- thumbnail grid ---- */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    padding: 16px 24px 24px;
    background: var(--bg);
  }
  .grid[hidden] { display: none; }
  .grid__head {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 1em;
    padding-bottom: 12px;
    font-family: var(--font-display);
  }
  .grid__title { font-size: 1rem; color: var(--muted); letter-spacing: 0.05em; }
  .grid__note { flex: 1; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
  .grid__head button { padding: 6px 18px; font-size: 0.95rem; }
  .grid__items {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    align-content: start;
  }
  .thumb {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    text-align: left;
  }
  .thumb:hover { border-color: var(--blue); }
  .thumb.is-current { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue); }
  .thumb img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 4px;
    background: var(--btn);
  }
  .thumb.is-missing img { display: none; }
  .thumb__missing {
    display: none;
    align-items: center;
    justify-content: center;
    aspect-ratio: 16 / 9;
    border-radius: 4px;
    background: var(--btn);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }
  .thumb.is-missing .thumb__missing { display: flex; }
  .thumb__label {
    display: flex;
    align-items: baseline;
    gap: 0.6em;
    min-width: 0;
    font-size: 0.85rem;
  }
  .thumb__num { flex: 0 0 auto; font-family: var(--font-mono); font-size: 0.85em; color: var(--muted); }
  .thumb__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="root">
  <header class="panel bar">
    <div class="deckstate">
      <div class="position">
        <span id="position">—</span>
        <span id="total"></span>
      </div>
      <div class="progress"><div id="progress" class="progress__fill"></div></div>
      <p class="upnext">
        <span class="upnext__label">NEXT</span>
        <span id="next-title">—</span>
      </p>
    </div>
    <div class="clockstate">
      <div id="elapsed">0:00</div>
      <div class="clockrow"><span id="wallclock">--:--</span></div>
      <div class="timer-buttons">
        <button id="btn-timer-toggle" type="button">開始</button>
        <button id="btn-timer-reset" type="button">リセット</button>
      </div>
    </div>
  </header>

  <section class="panel">
    <div class="panel__head">
      <span>ノート</span>
      <span class="spacer"></span>
      <div class="fontsize">
        <button id="btn-notes-minus" type="button" title="文字を小さく">A−</button>
        <button id="btn-notes-plus" type="button" title="文字を大きく">A＋</button>
      </div>
    </div>
    <h1 id="notes-title">—</h1>
    <div id="notes"><em>デッキ待機中… 別ウィンドウでスライドを開いてください。</em></div>
  </section>

  <section class="panel">
    <div class="panel__head"><span>スライド</span></div>
    <div id="outline" class="outline"></div>
  </section>

  <footer class="panel controls">
    <button id="btn-first" type="button">先頭</button>
    <button id="btn-last" type="button">末尾</button>
    <button id="btn-overview" class="is-overview" type="button">
      <svg class="btn-icon" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
        <rect x="0.5" y="0.5" width="3" height="3" rx="0.5"></rect>
        <rect x="4.5" y="0.5" width="3" height="3" rx="0.5"></rect>
        <rect x="8.5" y="0.5" width="3" height="3" rx="0.5"></rect>
        <rect x="0.5" y="4.5" width="3" height="3" rx="0.5"></rect>
        <rect x="4.5" y="4.5" width="3" height="3" rx="0.5"></rect>
        <rect x="8.5" y="4.5" width="3" height="3" rx="0.5"></rect>
        <rect x="0.5" y="8.5" width="3" height="3" rx="0.5"></rect>
        <rect x="4.5" y="8.5" width="3" height="3" rx="0.5"></rect>
        <rect x="8.5" y="8.5" width="3" height="3" rx="0.5"></rect>
      </svg>
      一覧
    </button>
    <button id="btn-prev" class="is-prev" type="button">← 前へ</button>
    <button id="btn-next" class="is-next" type="button">次へ →</button>
  </footer>
</div>

<div id="grid" class="grid" hidden>
  <div class="grid__head">
    <span class="grid__title">サムネイル</span>
    <span id="grid-note" class="grid__note"></span>
    <button id="btn-grid-close" type="button">閉じる (Esc)</button>
  </div>
  <div id="grid-items" class="grid__items"></div>
</div>

<script src="../core/presenter.js"></script>
</body>
</html>
