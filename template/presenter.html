<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Presenter — html-slide</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    grid-template-rows: auto 1fr auto;
    gap: 1px;
    background: #26282e;
    color: #e8e8e8;
    font: 15px/1.6 -apple-system, "Helvetica Neue", sans-serif;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 12px 22px;
    background: #16181c;
  }
  #clock { font: 700 30px ui-monospace, monospace; color: #4fd6c2; cursor: default; }
  #position { font: 600 20px ui-monospace, monospace; color: #9aa0ab; }
  #current-title { font-size: 18px; font-weight: 700; }
  #next-wrap { margin-left: auto; color: #9aa0ab; font-size: 14px; }
  #next-title { color: #e8e8e8; font-weight: 600; }
  main { background: #1d1f24; padding: 26px 30px; overflow: auto; }
  main h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: 0.1em; color: #9aa0ab; }
  #notes { font-size: 19px; line-height: 1.8; }
  nav { background: #1a1c21; overflow: auto; padding: 14px 0; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { padding: 7px 22px; cursor: pointer; color: #b9bec8; font-size: 14px; }
  #list li:hover { background: #24262d; }
  #list li.is-current { background: #2c3040; color: #fff; font-weight: 600; }
  kbd { background: #2c2f37; border-radius: 4px; padding: 1px 6px; font-size: 12px; }

  /* ---- big control row ----
   * One row of equal-width buttons: at a lectern the target is found
   * by position, and a row of differently sized ones is harder to hit
   * without looking. Only 次へ is filled, so the eye lands on the
   * button pressed most; 前へ is the same hue outlined. */
  footer.controls {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    padding: 12px 16px 14px;
    background: #16181c;
  }
  .controls button {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 0;
    border: 2px solid #33363f;
    border-radius: 10px;
    background: #22252d;
    color: #e8e8e8;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
  }
  .controls button:hover { border-color: #565c69; }
  .controls button.is-overview { border-color: #2b6f64; }
  .controls button.is-overview:hover { border-color: #4fd6c2; }
  .controls button.is-overview.is-on { background: #1d3833; border-color: #4fd6c2; }
  .controls button.is-prev { border-color: #b35b00; color: #ffb05c; }
  .controls button.is-prev:hover { background: #2a2118; }
  .controls button.is-next {
    background: #b35b00;
    border-color: #b35b00;
    color: #fff;
    flex-grow: 1.6;
  }
  .controls button.is-next:hover { background: #cc6a00; border-color: #cc6a00; }

  /* ---- slide overview overlay ---- */
  #overview {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10, 11, 14, 0.96);
    overflow: auto;
    padding: 24px;
  }
  #overview[hidden] { display: none; }
  #overview .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  #overview .tile {
    cursor: pointer;
    border: 2px solid #2c2f37;
    border-radius: 8px;
    overflow: hidden;
    background: #17191e;
  }
  #overview .tile:hover { border-color: #b35b00; }
  #overview .tile.is-current { border-color: #4fd6c2; }
  #overview .tile img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  #overview .tile .ph {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 16/9;
    color: #6b7280;
    font-size: 13px;
    padding: 0 12px;
    text-align: center;
  }
  #overview .tile .cap {
    padding: 6px 10px;
    font-size: 12.5px;
    color: #b9bec8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #overview .ov-hint { color: #6b7280; font-size: 12.5px; margin: 0 0 14px; }
</style>
</head>
<body>
<header>
  <span id="clock" title="r でリセット">00:00</span>
  <span id="position">– / –</span>
  <span id="current-title"></span>
  <span id="next-wrap">次: <span id="next-title"></span></span>
</header>
<main>
  <h2>ノート</h2>
  <div id="notes"><em>デッキ待機中… 別ウィンドウでスライドを開いてください。</em></div>
</main>
<nav><ul id="list"></ul></nav>
<footer class="controls">
  <button id="btn-first" title="先頭へ (Home)">|◀ 先頭</button>
  <button id="btn-last" title="末尾へ (End)">末尾 ▶|</button>
  <button id="btn-overview" class="is-overview" title="スライド一覧 (o)">▦ 一覧</button>
  <button id="btn-prev" class="is-prev" title="前へ (←)">← 前へ</button>
  <button id="btn-next" class="is-next" title="次へ (→ / Space)">次へ →</button>
</footer>
<div id="overview" hidden>
  <p class="ov-hint">クリックでそのスライドへ。画像は <code>html-slide capture</code> の出力（slide-captures/）を使い、無ければ番号タイルで代用します。<kbd>o</kbd> / <kbd>Esc</kbd> で閉じる</p>
  <div class="grid"></div>
</div>
<script src="../core/presenter.js"></script>
</body>
</html>
