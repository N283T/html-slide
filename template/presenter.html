<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Presenter — html-slide</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #101216;
    --panel: #17191e;
    --panel-2: #1b1e24;
    --line: #262a32;
    --fg: #e8eaef;
    --muted: #8b93a3;
    --accent: #ff8a3d;
    --accent-deep: #c25a10;
    --teal: #4fd6c2;
  }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    grid-template-rows: auto 3px 1fr auto;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, "Helvetica Neue", sans-serif;
  }

  /* ---- header ---- */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 14px 22px 10px;
  }
  #clock { font: 700 32px ui-monospace, monospace; color: var(--teal); letter-spacing: 0.02em; }
  #btn-reset {
    align-self: center;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 17px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
  }
  #btn-reset:hover { color: var(--fg); background: var(--panel-2); }
  #position { font: 600 20px ui-monospace, monospace; color: var(--muted); }
  #current-title { font-size: 18px; font-weight: 700; }
  #next-wrap { margin-left: auto; color: var(--muted); font-size: 14px; }
  #next-title { color: var(--fg); font-weight: 600; }

  /* ---- progress ---- */
  #progress { grid-column: 1 / -1; background: var(--line); }
  #progress > div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--teal), var(--accent));
    transition: width 0.25s ease;
  }

  /* ---- notes / list ---- */
  main {
    background: var(--panel);
    padding: 22px 30px;
    overflow: auto;
    border-right: 1px solid var(--line);
  }
  main .notes-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  main .notes-head h2 {
    margin: 0;
    font-size: 12.5px;
    letter-spacing: 0.12em;
    color: var(--muted);
    flex: 1;
  }
  .notes-head button {
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    border-radius: 7px;
    width: 34px;
    height: 28px;
    font: 600 13px ui-monospace, monospace;
    cursor: pointer;
  }
  .notes-head button:hover { color: var(--fg); border-color: #3a4050; }
  #notes { font-size: 19px; line-height: 1.85; }
  nav { background: var(--panel); overflow: auto; padding: 12px 0; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li {
    padding: 7px 22px;
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    border-left: 3px solid transparent;
  }
  #list li:hover { background: var(--panel-2); color: var(--fg); }
  #list li.is-current {
    background: var(--panel-2);
    color: #fff;
    font-weight: 600;
    border-left-color: var(--accent);
  }
  kbd { background: #262a32; border-radius: 4px; padding: 1px 6px; font-size: 12px; }

  /* ---- control row ----
   * Equal-height row, found by position at a lectern. 次へ is the one
   * filled button — the one pressed most — with 前へ joined to it as
   * an outlined pair. Utility buttons sit left, quieter. */
  footer.controls {
    grid-column: 1 / -1;
    display: flex;
    align-items: stretch;
    gap: 10px;
    padding: 14px 18px 16px;
    background: linear-gradient(180deg, #14161b, #0d0f13);
    border-top: 1px solid var(--line);
  }
  .controls button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel-2);
    color: var(--fg);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    padding: 15px 0;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .controls button:active { transform: scale(0.97); }
  .controls svg { width: 17px; height: 17px; fill: currentColor; flex: none; }

  .controls .jump { flex: 0 0 76px; color: var(--muted); }
  .controls .jump:hover { color: var(--fg); border-color: #3a4050; }

  .controls #btn-overview {
    flex: 1;
    color: var(--teal);
    border-color: #234b44;
    background: rgba(79, 214, 194, 0.06);
  }
  .controls #btn-overview:hover { border-color: var(--teal); }
  .controls #btn-overview.is-on { background: rgba(79, 214, 194, 0.16); border-color: var(--teal); }

  .controls .pair {
    flex: 2.6;
    display: flex;
    gap: 0;
    border-radius: 12px;
    overflow: hidden;
  }
  .controls .pair button { border-radius: 0; }
  .controls #btn-prev {
    flex: 1;
    color: var(--accent);
    border: 1px solid var(--accent-deep);
    border-right: none;
    background: rgba(255, 138, 61, 0.07);
  }
  .controls #btn-prev:hover { background: rgba(255, 138, 61, 0.15); }
  .controls #btn-next {
    flex: 1.7;
    font-size: 18px;
    border: none;
    background: linear-gradient(135deg, #e07a1f, var(--accent-deep));
    color: #fff;
    box-shadow: 0 4px 18px rgba(224, 122, 31, 0.25);
  }
  .controls #btn-next:hover { filter: brightness(1.1); }

  /* ---- slide overview overlay ---- */
  #overview {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10, 11, 14, 0.96);
    overflow: auto;
    padding: 24px;
  }
  #overview[hidden] { display: none; }
  #overview .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  #overview .tile {
    cursor: pointer;
    border: 2px solid #2c2f37;
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
  }
  #overview .tile:hover { border-color: var(--accent); }
  #overview .tile.is-current { border-color: var(--teal); }
  #overview .tile img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  #overview .tile .ph {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 16/9;
    color: #6b7280;
    font-size: 13px;
    padding: 0 12px;
    text-align: center;
  }
  #overview .tile .cap {
    padding: 6px 10px;
    font-size: 12.5px;
    color: #b9bec8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #overview .ov-hint { color: #6b7280; font-size: 12.5px; margin: 0 0 14px; }
</style>
</head>
<body>
<header>
  <span id="clock">00:00</span>
  <button id="btn-reset" title="タイマーをリセット (r)">⟲</button>
  <span id="position">– / –</span>
  <span id="current-title"></span>
  <span id="next-wrap">次: <span id="next-title"></span></span>
</header>
<div id="progress"><div></div></div>
<main>
  <div class="notes-head">
    <h2>ノート</h2>
    <button id="btn-notes-minus" title="ノートの文字を小さく">A−</button>
    <button id="btn-notes-plus" title="ノートの文字を大きく">A＋</button>
  </div>
  <div id="notes"><em>デッキ待機中… 別ウィンドウでスライドを開いてください。</em></div>
</main>
<nav><ul id="list"></ul></nav>
<footer class="controls">
  <button id="btn-first" class="jump" title="先頭へ (Home)">
    <svg viewBox="0 0 16 16"><path d="M2 2h2v12H2zM14 2v12L5.5 8z"/></svg>
  </button>
  <button id="btn-last" class="jump" title="末尾へ (End)">
    <svg viewBox="0 0 16 16"><path d="M12 2h2v12h-2zM2 2v12L10.5 8z"/></svg>
  </button>
  <button id="btn-overview" title="スライド一覧 (o)">
    <svg viewBox="0 0 16 16"><path d="M1 1h4v4H1zM6 1h4v4H6zM11 1h4v4h-4zM1 6h4v4H1zM6 6h4v4H6zM11 6h4v4h-4zM1 11h4v4H1zM6 11h4v4H6zM11 11h4v4h-4z"/></svg>
    一覧
  </button>
  <div class="pair">
    <button id="btn-prev" title="前へ (←)">← 前へ</button>
    <button id="btn-next" title="次へ (→ / Space)">次へ →</button>
  </div>
</footer>
<div id="overview" hidden>
  <p class="ov-hint">クリックでそのスライドへ。画像は <code>html-slide capture</code> の出力（slide-captures/）を使い、無ければ番号タイルで代用します。<kbd>o</kbd> / <kbd>Esc</kbd> で閉じる</p>
  <div class="grid"></div>
</div>
<script src="../core/presenter.js"></script>
</body>
</html>
